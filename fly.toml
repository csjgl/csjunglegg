# fly.toml app configuration file generated for csjunglegg on 2025-05-16T14:04:21+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'csjunglegg'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[processes]
  crash = "node crash-broadcaster.js"
  roulette = "node roulette-broadcaster.js"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
